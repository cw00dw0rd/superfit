<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Superfit Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Classes</h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="search" class="active"><span>🏠</span>Classes</button>
    <button data-tab="agenda"><span>📅</span>Agenda</button>
    <button data-tab="friends"><span>👥</span>Friends</button>
    <button data-tab="progress"><span>🏆</span>Progress</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
