name: Build Android APK
# Manual for now (Actions tab -> Build Android APK -> Run workflow); the web app is the main target.
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap add android && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sf-planner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
